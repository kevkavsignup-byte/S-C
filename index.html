<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>6M Strength</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' fill='%230d0d0d'/><rect x='16' y='86' width='160' height='20' rx='4' fill='%23e63946'/><rect x='40' y='60' width='16' height='72' rx='4' fill='%23e63946'/><rect x='136' y='60' width='16' height='72' rx='4' fill='%23e63946'/><rect x='20' y='74' width='28' height='44' rx='6' fill='%23c1121f'/><rect x='144' y='74' width='28' height='44' rx='6' fill='%23c1121f'/><text x='96' y='148' font-family='Arial Black' font-size='22' font-weight='900' fill='%23e63946' text-anchor='middle'>6M</text></svg>">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;--surf:#111;--surf2:#161616;--surf3:#1a1a1a;
  --border:#222;--border2:#1a1a1a;
  --accent:#e63946;--accent-dim:rgba(230,57,70,0.12);
  --text:#f0ede8;--text2:#aaa8a4;--text3:#666;--text4:#444;
  --green:#5cb85c;--green-dim:rgba(92,184,92,0.12);
  --font-display:'Arial Black','Arial Bold',Arial,sans-serif;
  --font-mono:'Courier New',Courier,monospace;
  --nav-h:64px;--safe-bottom:env(safe-area-inset-bottom,0px);
}
body.light{
  --bg:#f5f4f0;--surf:#ffffff;--surf2:#f0eeea;--surf3:#e8e6e1;
  --border:#d8d5cf;--border2:#e8e6e1;
  --text:#1a1a1a;--text2:#444;--text3:#888;--text4:#aaa;
  --green:#2d8a4e;--green-dim:rgba(45,138,78,0.1);
  --accent:#e63946;--accent-dim:rgba(230,57,70,0.08);
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-mono);overflow-x:hidden}
#app{min-height:100vh;padding-bottom:calc(var(--nav-h) + var(--safe-bottom))}
/* SCROLLBAR */
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
/* BOTTOM NAV */
#nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-bottom));background:rgba(10,10,10,0.97);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:0;backdrop-filter:blur(10px);z-index:100;overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 0 0;border:none;background:none;color:var(--text4);font-family:var(--font-mono);font-size:8px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:color .15s}
.nav-btn.active{color:var(--accent)}
.nav-icon{font-size:20px;line-height:1}
/* HEADER */
.hdr{background:var(--surf);border-bottom:1px solid var(--border);padding:52px 16px 14px;position:sticky;top:0;z-index:50;backdrop-filter:blur(8px)}
.hdr-sub{font-size:9px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:3px}
.hdr-title{font-family:var(--font-display);font-size:26px;font-weight:900;letter-spacing:.01em;line-height:1}
.hdr-back{display:flex;align-items:center;gap:8px;border:none;background:none;color:var(--text3);font-family:var(--font-mono);font-size:11px;cursor:pointer;padding:0 0 8px}
/* CARDS */
.card{background:var(--surf);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin:12px 16px}
.card-hdr{padding:14px 16px;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center}
.card-hdr-title{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:.04em}
.card-body{padding:14px 16px}
/* BUTTONS */
.btn{border:none;border-radius:4px;font-family:var(--font-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--accent);color:#fff;padding:14px 20px;font-size:15px;width:100%}
.btn-primary:active{opacity:.85;transform:scale(.98)}
.btn-secondary{background:var(--surf3);color:var(--text2);padding:10px 16px;font-size:13px;border:1px solid var(--border)}
.btn-ghost{background:none;color:var(--text3);padding:8px 12px;font-size:12px;border:1px solid var(--border2)}
.btn-danger{background:rgba(230,57,70,.15);color:var(--accent);padding:10px 16px;font-size:13px;border:1px solid rgba(230,57,70,.25)}
.btn-success{background:var(--green);color:#fff;padding:14px 20px;font-size:15px;width:100%}
/* CHIPS */
.chip{display:inline-block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:2px;font-weight:600}
.chip-accent{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(230,57,70,.25)}
.chip-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(92,184,92,.25)}
.chip-muted{background:var(--surf3);color:var(--text4);border:1px solid var(--border2)}
/* INPUTS */
input[type=number],input[type=text]{background:var(--surf3);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:var(--font-display);font-size:18px;font-weight:700;text-align:center;width:100%;padding:10px 6px;-moz-appearance:textfield;outline:none;transition:border-color .15s}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]:focus,input[type=text]:focus{border-color:var(--accent)}
/* DIVIDER */
.divider{height:1px;background:var(--border2);margin:0 16px}
/* SECTION LABEL */
.section-label{font-size:8px;font-weight:600;letter-spacing:.2em;color:var(--text4);text-transform:uppercase;padding:16px 16px 8px}
/* TAG STRIP */
.tag-strip{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 12px}
/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border)}
.stat-cell{background:var(--surf);padding:14px 0;text-align:center}
.stat-val{font-family:var(--font-display);font-size:24px;font-weight:900;color:var(--text)}
.stat-key{font-size:8px;letter-spacing:.14em;color:var(--text4);text-transform:uppercase;margin-top:2px}
/* EXERCISE CARD */
.ex-card{border:1px solid var(--border);border-radius:5px;margin:0 16px 12px;overflow:hidden}
.ex-hdr{background:var(--surf2);padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-name{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:.02em;line-height:1.2}
.ex-note{font-size:9px;color:var(--text3);margin-top:3px;line-height:1.5}
.ex-prev{font-size:9px;color:var(--green);letter-spacing:.06em}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 36px;gap:8px;padding:10px 14px;border-top:1px solid var(--border2);align-items:center}
.set-num{font-size:10px;color:var(--text4);font-weight:600;text-align:center}
.set-done{width:32px;height:32px;border-radius:3px;border:1px solid var(--border);background:var(--surf3);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all .15s;flex-shrink:0}
.set-done.checked{background:var(--green);border-color:var(--green);color:#fff}
.set-label{font-size:8px;color:var(--text4);text-align:center;margin-top:2px;letter-spacing:.08em;text-transform:uppercase}
/* MOBILITY ROW */
.mob-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-top:1px solid var(--border2);gap:12px}
.mob-check{width:24px;height:24px;border-radius:2px;border:1px solid var(--border);background:var(--surf3);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .15s;flex-shrink:0}
.mob-check.checked{background:var(--green);border-color:var(--green)}
.mob-name{font-family:var(--font-display);font-size:14px;font-weight:600;flex:1;line-height:1.2}
.mob-dur{font-size:9px;color:var(--accent);font-weight:500;white-space:nowrap}
.mob-cue{font-size:9px;color:var(--text4);line-height:1.5;margin-top:2px}
/* HISTORY ITEM */
.hist-item{padding:14px 16px;border-bottom:1px solid var(--border2);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.hist-item:active{background:var(--surf2)}
/* LIBRARY */
.lib-search{display:flex;gap:8px;padding:12px 16px;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:88px;z-index:40}
.lib-search input{flex:1;background:var(--surf3);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--font-mono);font-size:12px;padding:9px 12px;outline:none}
.lib-search input:focus{border-color:var(--accent)}
.lib-search input::placeholder{color:var(--text4)}
.filter-scroll{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border2)}
.filter-scroll::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surf);font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--text4);cursor:pointer;transition:all .15s;text-transform:uppercase;white-space:nowrap}
.filter-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.ex-lib-item{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--border2);cursor:pointer;transition:background .1s}
.ex-lib-item:active{background:var(--surf2)}
.ex-lib-name{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.2}
.ex-lib-meta{font-size:9px;color:var(--text4);margin-top:3px;letter-spacing:.06em}
.ex-lib-cat{font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:2px 7px;border-radius:2px;flex-shrink:0;margin-left:10px}
.step-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border2)}
.step-num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--font-display);font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.step-text{font-size:11px;color:var(--text2);line-height:1.7}
.step-title{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--text);letter-spacing:.04em;margin-bottom:3px}
.mistake-item{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border2);align-items:flex-start}
.mistake-x{color:var(--accent);font-size:14px;flex-shrink:0;margin-top:1px}
.mistake-text{font-size:11px;color:var(--text2);line-height:1.6}
.cue-item{display:flex;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border2);align-items:flex-start}
.cue-tick{color:var(--green);font-size:14px;flex-shrink:0;margin-top:1px}
.cue-text{font-size:11px;color:var(--text2);line-height:1.6}
.muscle-tags{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px}
.muscle-tag{font-size:9px;padding:3px 9px;border-radius:2px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.muscle-primary{background:rgba(230,57,70,.12);color:var(--accent);border:1px solid rgba(230,57,70,.25)}
.muscle-secondary{background:var(--surf3);color:var(--text3);border:1px solid var(--border)}
.section-block{background:var(--surf);border:1px solid var(--border);border-radius:6px;margin:12px 16px;overflow:hidden}
.section-block-hdr{padding:11px 16px;border-bottom:1px solid var(--border2);background:var(--surf2)}
.section-block-hdr-title{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--text3);text-transform:uppercase}

.ready-score-ring{position:relative;width:140px;height:140px;margin:0 auto}
.ready-score-ring svg{transform:rotate(-90deg)}
.ready-score-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.ready-score-num{font-family:var(--font-display);font-size:44px;font-weight:900;line-height:1}
.ready-score-label{font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin-top:2px}
.ready-traffic{display:flex;gap:8px;justify-content:center;margin:16px 0}
.ready-light{width:20px;height:20px;border-radius:50%;opacity:.2}
.ready-light.on{opacity:1}
.slider-wrap{padding:0 16px 16px}
.slider-label{display:flex;justify-content:space-between;margin-bottom:8px}
.slider-name{font-size:11px;color:var(--text2);letter-spacing:.04em}
.slider-val{font-family:var(--font-display);font-size:18px;font-weight:900;color:var(--accent)}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;background:var(--surf3);border-radius:3px;outline:none;border:1px solid var(--border)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg)}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px}
.soreness-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px}
.soreness-zone{background:var(--surf2);border:1px solid var(--border);border-radius:5px;padding:10px 12px}
.soreness-zone-name{font-size:10px;color:var(--text3);letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase}
.soreness-zone-val{font-family:var(--font-display);font-size:22px;font-weight:900;text-align:center;margin:4px 0}
.soreness-btns{display:flex;justify-content:center;gap:6px}
.s-btn{width:28px;height:28px;border-radius:3px;border:1px solid var(--border);background:var(--surf3);color:var(--text2);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s}
.s-btn:active{transform:scale(.92)}
.step-dots{display:flex;gap:6px;justify-content:center;padding:12px 0}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--surf3);border:1px solid var(--border);transition:all .2s}
.step-dot.active{background:var(--accent);border-color:var(--accent)}
.step-dot.done{background:var(--green);border-color:var(--green)}
.rec-item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border2);align-items:flex-start}
.rec-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.rec-text{font-size:11px;color:var(--text2);line-height:1.6}
.rec-title{font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--text);margin-bottom:2px}
.factor-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border2)}
.factor-label{font-size:10px;color:var(--text3)}
.factor-bar{flex:1;height:4px;background:var(--surf3);border-radius:2px;margin:0 12px;overflow:hidden}
.factor-fill{height:100%;border-radius:2px;transition:width .4s ease}
.factor-score{font-family:var(--font-display);font-size:14px;font-weight:700;min-width:30px;text-align:right}
.history-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:2px;font-size:9px;font-weight:600;letter-spacing:.1em}
.trend-up{color:var(--green)}
.trend-down{color:var(--accent)}
.trend-flat{color:var(--text4)}
/* STEP NAV */
.step-nav{display:flex;gap:8px;padding:16px 16px 0}
{padding:0 16px 6px}
.prog-bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:4px}
.prog-bar-track{height:6px;background:var(--surf3);border-radius:3px;overflow:hidden}
.prog-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}
/* BLOCK SELECTOR */
.block-scroller{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.block-scroller::-webkit-scrollbar{display:none}
.block-pill{flex-shrink:0;border:1px solid var(--border);border-radius:4px;padding:10px 14px;cursor:pointer;transition:all .15s;background:var(--surf)}
.block-pill.active{border-color:var(--accent);border-top-width:2px;background:var(--surf2)}
.block-pill-label{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--text3)}
.block-pill.active .block-pill-label{color:var(--accent)}
.block-pill-sub{font-family:var(--font-display);font-size:16px;font-weight:900;color:var(--text4);margin-top:1px}
.block-pill.active .block-pill-sub{color:var(--text)}
/* WEEK TABS */
.week-tabs{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.week-tab{flex:1;min-width:70px;border:1px solid var(--border2);border-radius:3px;padding:8px 6px;text-align:center;cursor:pointer;background:var(--surf);transition:all .15s}
.week-tab.active{border-color:var(--border);border-top:2px solid var(--accent);background:var(--surf2)}
.week-tab-label{font-size:8px;letter-spacing:.12em;color:var(--text4);text-transform:uppercase}
.week-tab.active .week-tab-label{color:var(--accent)}
.week-tab-scheme{font-family:var(--font-display);font-size:16px;font-weight:900;color:var(--text4);margin-top:2px}
.week-tab.active .week-tab-scheme{color:var(--text)}
/* SESSION TABS */
.sess-tabs{display:flex;gap:6px;padding:0 16px 12px}
.sess-tab{flex:1;border:1px solid var(--border);border-radius:3px;padding:12px 6px;text-align:center;cursor:pointer;background:var(--surf);transition:all .15s;font-family:var(--font-display);font-weight:700;letter-spacing:.08em;font-size:13px;color:var(--text3)}
.sess-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
/* COLLAPSIBLE */
.collapsible-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;border-bottom:1px solid var(--border2)}
.collapsible-hdr-l{display:flex;align-items:center;gap:10px}
.collapsible-icon{width:26px;height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.collapsible-icon.mob{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(230,57,70,.3)}
.collapsible-icon.main{background:var(--accent);color:#fff}
.collapsible-icon.cool{background:var(--green-dim);color:var(--green);border:1px solid rgba(92,184,92,.25)}
.collapsible-title{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.06em}
.collapsible-meta{font-size:8px;color:var(--text4);letter-spacing:.1em;margin-top:1px}
.toggle-arrow{color:var(--text4);font-size:14px;transition:transform .2s}
.toggle-arrow.open{transform:rotate(180deg)}
/* WORKOUT HEADER */
.wkt-hdr{background:var(--surf);border-bottom:1px solid var(--border);padding:52px 16px 14px;position:sticky;top:0;z-index:50}
.wkt-progress{height:3px;background:var(--surf3);border-radius:2px;margin-top:10px;overflow:hidden}
.wkt-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s ease}
/* TIMER */
.timer-display{font-family:var(--font-display);font-size:32px;font-weight:900;color:var(--accent);letter-spacing:.02em}
/* MUSCLE TRACKER */
.muscle-strip{margin:0 16px 12px;background:var(--surf);border:1px solid var(--border);border-radius:6px;padding:12px 14px;cursor:pointer}
.muscle-strip-title{font-size:8px;font-weight:600;letter-spacing:.18em;color:var(--text4);text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.muscle-dot-row{display:flex;gap:5px;flex-wrap:wrap}
.muscle-dot{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:36px}
.muscle-dot-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;border:2px solid transparent}
.muscle-dot-label{font-size:7px;letter-spacing:.04em;text-align:center;color:var(--text4);text-transform:uppercase;line-height:1.2;max-width:36px}
.heat-today{background:rgba(230,57,70,.15);border-color:rgba(230,57,70,.5);color:#e63946}
.heat-2day{background:rgba(231,111,81,.15);border-color:rgba(231,111,81,.5);color:#e76f51}
.heat-3day{background:rgba(244,162,97,.15);border-color:rgba(244,162,97,.4);color:#f4a261}
.heat-ready{background:rgba(92,184,92,.12);border-color:rgba(92,184,92,.4);color:#5cb85c}
.heat-fresh{background:var(--surf3);border-color:var(--border);color:var(--text4)}
/* BODY SVG */
.body-wrap{display:flex;gap:12px;justify-content:center;padding:16px 16px 8px}
.body-panel{flex:1;max-width:160px;text-align:center}
.body-label{font-size:8px;letter-spacing:.14em;color:var(--text4);text-transform:uppercase;margin-bottom:6px}
/* MUSCLE LIST */
.muscle-list-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border2);cursor:pointer}
.muscle-list-row:active{background:var(--surf2)}
.muscle-heat-bar-wrap{flex:1;height:5px;background:var(--surf3);border-radius:3px;overflow:hidden}
.muscle-heat-bar{height:100%;border-radius:3px;transition:width .4s ease}
.muscle-days-badge{font-family:var(--font-display);font-size:13px;font-weight:700;min-width:32px;text-align:right}
.muscle-status-text{font-size:9px;min-width:64px;text-align:right;letter-spacing:.06em;text-transform:uppercase}

#rest-timer{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 10px);left:16px;right:16px;background:var(--surf2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;z-index:95;box-shadow:0 4px 24px rgba(0,0,0,.4);display:none;align-items:center;gap:12px}
#rest-timer.visible{display:flex}
.rt-circle{width:48px;height:48px;flex-shrink:0;position:relative}
.rt-circle svg{transform:rotate(-90deg)}
.rt-count{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--font-display);font-size:16px;font-weight:900;color:var(--accent)}
.rt-label{flex:1}
.rt-title{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--text)}
.rt-sub{font-size:9px;color:var(--text4);letter-spacing:.08em;margin-top:2px}
.rt-presets{display:flex;gap:5px;margin-top:6px}
.rt-preset{padding:5px 9px;border-radius:3px;border:1px solid var(--border);background:var(--surf3);font-family:var(--font-display);font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;transition:all .1s}
.rt-preset.active-preset{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
.rt-stop{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surf3);color:var(--text3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* OVERLOAD SUGGESTION */
.overload-bar{margin:8px 16px 0;background:rgba(230,57,70,.06);border:1px solid rgba(230,57,70,.2);border-radius:5px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.overload-icon{font-size:18px;flex-shrink:0}
.overload-text{flex:1}
.overload-title{font-family:var(--font-display);font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.overload-sub{font-size:10px;color:var(--text3);margin-top:2px;line-height:1.5}
.overload-target{font-family:var(--font-display);font-size:22px;font-weight:900;color:var(--accent);flex-shrink:0;text-align:right}
.overload-target-sub{font-size:9px;color:var(--text4);text-align:right}
/* 1RM CALCULATOR */
.rm-panel{margin:12px 16px;background:var(--surf);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.rm-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.rm-field label{font-size:9px;color:var(--text4);letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:6px}
.rm-result{background:var(--surf2);border-top:1px solid var(--border);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.rm-result-num{font-family:var(--font-display);font-size:36px;font-weight:900;color:var(--accent)}
.rm-result-label{font-size:9px;color:var(--text4);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.rm-intensity-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border)}
.rm-int-cell{background:var(--surf);padding:10px 6px;text-align:center}
.rm-int-pct{font-size:9px;color:var(--text4);letter-spacing:.08em}
.rm-int-val{font-family:var(--font-display);font-size:16px;font-weight:900;color:var(--text);margin-top:2px}
/* THEME TOGGLE */
.theme-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surf);border:1px solid var(--border);border-radius:6px;margin:0 16px;cursor:pointer;user-select:none}
.toggle-track{width:48px;height:26px;border-radius:13px;background:var(--surf3);border:1px solid var(--border);position:relative;transition:background .2s;flex-shrink:0}
.toggle-track.on{background:var(--accent);border-color:var(--accent)}
.toggle-thumb{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle-track.on .toggle-thumb{transform:translateX(22px)}

/* TOAST */
#toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--surf2);border:1px solid var(--border);border-radius:4px;padding:10px 20px;font-size:11px;letter-spacing:.06em;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;z-index:200}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ADD SET BTN */
.add-set-row{padding:10px 14px;border-top:1px solid var(--border2)}
/* ANIMATIONS */
@keyframes fadeSlide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-slide{animation:fadeSlide .22s ease forwards}
/* HOME SPECIFIC */
.next-sess-card{background:var(--surf);border:1px solid var(--border);border-radius:8px;margin:12px 16px;overflow:hidden}
.next-sess-top{padding:16px;border-bottom:1px solid var(--border2)}
.next-sess-label{font-size:9px;letter-spacing:.18em;color:var(--text4);text-transform:uppercase;margin-bottom:4px}
.next-sess-name{font-family:var(--font-display);font-size:22px;font-weight:900;letter-spacing:.02em}
.next-sess-focus{font-size:10px;color:var(--text3);margin-top:3px;line-height:1.5}
.streak-badge{display:flex;align-items:center;gap:6px;font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--accent)}
/* EMPTY STATE */
.empty{padding:40px 16px;text-align:center;color:var(--text4);font-size:11px;line-height:1.8;letter-spacing:.04em}
.empty-icon{font-size:40px;margin-bottom:12px;display:block;opacity:.4}
/* PREV BEST BADGE */
.prev-best{background:rgba(92,184,92,.08);border:1px solid rgba(92,184,92,.2);border-radius:3px;padding:3px 8px;font-size:9px;color:var(--green);letter-spacing:.06em;white-space:nowrap}
/* SCHEME BADGE */
.scheme-badge{background:var(--accent-dim);border:1px solid rgba(230,57,70,.3);border-radius:3px;padding:4px 10px;font-family:var(--font-display);font-size:16px;font-weight:900;color:var(--accent)}
</style>
</head>

<div id="toast"></div>

      <circle cx="24" cy="24" r="20" fill="none" stroke="var(--surf3)" stroke-width="4"/>
      <circle id="rt-arc" cx="24" cy="24" r="20" fill="none" stroke="var(--accent)" stroke-width="4"
        stroke-dasharray="125.6" stroke-dashoffset="0" stroke-linecap="round"/>

const DB={
  getSettings:()=>{try{return JSON.parse(localStorage.getItem('s6m_settings'))||{startDate:null,unit:'kg',theme:'dark'}}catch{return{startDate:null,unit:'kg',theme:'dark'}}},
  saveSettings:(s)=>localStorage.setItem('s6m_settings',JSON.stringify(s)),
  getWorkouts:()=>{try{return JSON.parse(localStorage.getItem('s6m_workouts'))||{}}catch{return{}}},
  saveWorkout:(w)=>{const all=DB.getWorkouts();all[w.id]=w;localStorage.setItem('s6m_workouts',JSON.stringify(all))},
  deleteWorkout:(id)=>{const all=DB.getWorkouts();delete all[id];localStorage.setItem('s6m_workouts',JSON.stringify(all))},
  getWorkoutList:()=>Object.values(DB.getWorkouts()).sort((a,b)=>new Date(b.date)-new Date(a.date)),
  getReadinessLog:()=>{try{return JSON.parse(localStorage.getItem('s6m_readiness'))||[]}catch{return[]}},
  saveReadiness:(entry)=>{
    const log=DB.getReadinessLog();
    const idx=log.findIndex(r=>r.date===entry.date);
    if(idx>=0)log[idx]=entry; else log.unshift(entry);
    log.splice(20); // keep last 20 entries
    localStorage.setItem('s6m_readiness',JSON.stringify(log));
  },
  getTodayReadiness:()=>{
    const log=DB.getReadinessLog();
    return log.find(r=>r.date===today())||null;
  },
  getHRBaseline:()=>{
    const log=DB.getReadinessLog().filter(r=>r.restingHR>0);
    if(log.length<3)return null;
    const recent=log.slice(0,7).map(r=>r.restingHR);
    return Math.round(recent.reduce((a,b)=>a+b,0)/recent.length);
  },
  getExerciseHistory:(name)=>{
    return Object.values(DB.getWorkouts())
      .filter(w=>w.completed&&w.exercises&&w.exercises.some(e=>e.name===name))
      .sort((a,b)=>new Date(b.date)-new Date(a.date))
      .slice(0,12)
      .map(w=>({date:w.date,blockLabel:w.blockLabel,weekLabel:w.weekLabel,sets:w.exercises.find(e=>e.name===name)?.sets||[]}))
  },
  getPrevBest:(name)=>{
    const h=DB.getExerciseHistory(name);
    const allSets=h.flatMap(s=>s.sets.filter(set=>parseFloat(set.weight)>0));
    if(!allSets.length)return null;
    return allSets.reduce((max,s)=>parseFloat(s.weight)>parseFloat(max.weight)?s:max,allSets[0]);
  },
  getLastSets:(name)=>{
    const h=DB.getExerciseHistory(name);
    return h.length?h[0].sets:[];
  }
};

function fmtDate(d){
  const dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDateShort(d){
  const dt=new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-IE',{day:'numeric',month:'short'});
}
function today(){return new Date().toISOString().split('T')[0]}
function getCurrentRecommendation(){
  const settings=DB.getSettings();
  if(!settings.startDate)return{block:0,week:0,session:'upper'};
  const start=new Date(settings.startDate);
  const now=new Date();
  const daysDiff=Math.floor((now-start)/(1000*60*60*24));
  const workoutDay=daysDiff%21; // 3 weeks * 7 days cycle within each 4-week block
  const blockIdx=Math.min(Math.floor(daysDiff/28),5);
  const weekInBlock=Math.min(Math.floor((daysDiff%28)/7),3);
  const sessions=['upper','lower','total'];
  const sessionIdx=Math.floor((daysDiff%3));
  return{block:blockIdx,week:weekInBlock,session:sessions[sessionIdx%3]};
}
function getStreak(){
  const workouts=DB.getWorkoutList().filter(w=>w.completed);
  if(!workouts.length)return 0;
  let streak=0;
  const now=new Date();
  let checkDate=new Date(now);
  checkDate.setHours(0,0,0,0);
  for(let i=0;i<60;i++){
    const ds=checkDate.toISOString().split('T')[0];
    if(workouts.some(w=>w.date===ds)){streak++;checkDate.setDate(checkDate.getDate()-1);}
    else if(i===0&&!workouts.some(w=>w.date===ds)){checkDate.setDate(checkDate.getDate()-1);}
    else break;
  }
  return streak;
}
function getMaxWeight(sets){
  const weights=sets.filter(s=>parseFloat(s.weight)>0).map(s=>parseFloat(s.weight));
  return weights.length?Math.max(...weights):0;
}
function sessionTypeLabel(t){return t==='upper'?'UPPER':t==='lower'?'LOWER':'TOTAL BODY'}
function sessionTypeIcon(t){return t==='upper'?'↑':t==='lower'?'↓':'◎'}
function blockById(id){return BLOCKS.find(b=>b.id===id)}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

// START WORKOUT
// ═══════════════════════════════════════════════════════
function startWorkout(blockIdx,weekIdx,sessionType){
  const block=BLOCKS[blockIdx];
  const week=block.loading[weekIdx];
  const session=block.sessions[sessionType];
  const settings=DB.getSettings();
  if(!settings.startDate){settings.startDate=today();DB.saveSettings(settings);}
  const unit=settings.unit||'kg';
  // Build workout object
  const exercises=session.exercises.map(ex=>{
    const sets=ex.isPrimary?week.sets:(ex.defaultSets||3);
    const reps=ex.isPrimary?week.reps:(ex.defaultReps||week.reps);
    const lastSets=DB.getLastSets(ex.name);
    const prevBest=DB.getPrevBest(ex.name);
    const suggestedWeight=lastSets.length&&parseFloat(lastSets[0].weight)>0?lastSets[0].weight:'';
    return{
      name:ex.name,notes:ex.notes||'',isPrimary:ex.isPrimary||false,
      defaultSets:sets,defaultReps:reps,
      prevBest:prevBest,
      sets:Array.from({length:sets},(_,i)=>({
        weight:suggestedWeight,
        reps:typeof reps==='number'?reps:'',
        done:false
      }))
    };
  });
  const mobility=session.mobility.map(m=>({...m,done:false}));
  const cooldown=session.cooldown.map(c=>({...c,done:false}));
  S.workout={
    id:`wkt_${Date.now()}`,
    blockId:block.id,blockLabel:block.label,
    weekNum:weekIdx,weekLabel:week.scheme,
    sessionType,sessionLabel:session.label,sessionFocus:session.focus,
    date:today(),
    completed:false,
    scheme:week.scheme,
    intensity:week.intensity,
    unit,
    phase:'mobility', // mobility | main | cooldown
    exercises,mobility,cooldown,
    startTime:Date.now()
  };
  nav('workout');
}
function viewSession(blockIdx,weekIdx,sessionType){
  S.prog={block:blockIdx,week:weekIdx,session:sessionType,open:'main'};
  nav('programme');
}

// Workout interactions
function updateSet(ei,si,field,val){
  if(!S.workout)return;
  S.workout.exercises[ei].sets[si][field]=field==='weight'?parseFloat(val)||'':val;
  DB.saveWorkout(S.workout);
  // Partial re-render - just update progress
  const doneExercises=S.workout.exercises.filter(e=>e.sets.every(s=>s.done)).length;
  const pct=Math.round((doneExercises/S.workout.exercises.length)*100);
  const fill=document.querySelector('.wkt-progress-fill');
  if(fill)fill.style.width=pct+'%';
}
function toggleSet(ei,si){
  if(!S.workout)return;
  const wasDone = S.workout.exercises[ei].sets[si].done;
  S.workout.exercises[ei].sets[si].done = !wasDone;
  DB.saveWorkout(S.workout);
  // Auto-start rest timer when a set is marked done (not undone)
  if(!wasDone){
    const ex = S.workout.exercises[ei];
    const isPrimary = ex.isPrimary;
    // Suggest rest time based on exercise type and block
    const blockId = S.workout.blockId || 1;
    let restSecs = 90; // default
    if(isPrimary && blockId >= 4) restSecs = 180;
    else if(isPrimary && blockId >= 3) restSecs = 150;
    else if(isPrimary) restSecs = 120;
    startRest(restSecs);
  }
  render();
}
function addSet(ei){
  if(!S.workout)return;
  const ex=S.workout.exercises[ei];
  const lastSet=ex.sets[ex.sets.length-1];
  ex.sets.push({weight:lastSet?.weight||'',reps:lastSet?.reps||'',done:false});
  DB.saveWorkout(S.workout);
  render();
}
function removeSet(ei){
  if(!S.workout)return;
  const ex=S.workout.exercises[ei];
  if(ex.sets.length>1)ex.sets.pop();
  DB.saveWorkout(S.workout);
  render();
}
function toggleMobility(i){
  if(!S.workout)return;
  S.workout.mobility[i].done=!S.workout.mobility[i].done;
  DB.saveWorkout(S.workout);
  render();
}
function toggleCooldown(i){
  if(!S.workout)return;
  S.workout.cooldown[i].done=!S.workout.cooldown[i].done;
  DB.saveWorkout(S.workout);
  render();
}
function completeWorkout(){
  if(!S.workout)return;
  const setsLogged=S.workout.exercises.some(e=>e.sets.some(s=>parseFloat(s.weight)>0||s.done));
  if(!setsLogged&&!confirm('No weights logged — still complete?'))return;
  S.workout.completed=true;
  S.workout.duration=Math.round((Date.now()-S.workout.startTime)/60000);
  DB.saveWorkout(S.workout);
  toast('✓ Workout saved!');
  S.workout=null;
  nav('history');
}
function abandonWorkout(){
  if(confirm('Abandon this workout? Progress will be lost.')){
    S.workout=null;nav('home');
  }
}

    <div>

    </div>
    <div style="text-align:right">
      ${w.duration?`<div style="font-size:10px;color:var(--text3)">${w.duration}min</div>`:''}
      <div style="font-size:9px;color:var(--text4);margin-top:2px">›</div>
    </div>
  </div>`).join('')}
  </div>`).join('')}
  <div style="height:16px"></div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
// PROGRESSIVE OVERLOAD ENGINE
// ═══════════════════════════════════════════════════════
function calcOverloadSuggestion(exName, currentScheme){
  const history = DB.getExerciseHistory(exName);
  if(!history.length) return null;

  const last = history[0]; // most recent session
  const lastSets = last.sets.filter(s => parseFloat(s.weight) > 0 && parseInt(s.reps) > 0);
  if(!lastSets.length) return null;

  const unit = DB.getSettings().unit || 'kg';
  const increment = unit === 'kg' ? 2.5 : 5;

  // Parse current target reps from scheme e.g. "4 × 8" → 8
  const targetReps = currentScheme ? parseInt(currentScheme.split('×')[1]) || 0 : 0;
  const targetSets = currentScheme ? parseInt(currentScheme.split('×')[0]) || 0 : 0;

  const lastMaxWeight = Math.max(...lastSets.map(s => parseFloat(s.weight)));
  const lastAvgReps = Math.round(lastSets.reduce((a,s) => a + parseInt(s.reps), 0) / lastSets.length);
  const lastSetsCount = lastSets.filter(s => s.done).length;
  const allSetsCompleted = lastSetsCount >= (targetSets || lastSets.length);

  let suggestedWeight = lastMaxWeight;
  let rationale = '';
  let status = 'maintain'; // 'increase' | 'maintain' | 'decrease'

  if(allSetsCompleted && lastAvgReps >= targetReps){
    // All sets completed at or above target reps → increase load
    suggestedWeight = Math.round((lastMaxWeight + increment) * 2) / 2;
    rationale = `Last session: ${lastMaxWeight}${unit} × ${lastAvgReps} (all sets ✓) — add ${increment}${unit}`;
    status = 'increase';
  } else if(!allSetsCompleted || lastAvgReps < targetReps - 1){
    // Missed sets or significantly below target reps → hold load
    suggestedWeight = lastMaxWeight;
    rationale = `Last session: ${lastMaxWeight}${unit} — not all sets completed. Hold weight and nail the reps first.`;
    status = 'maintain';
  } else {
    // Within 1 rep of target → hold and push for the extra rep
    suggestedWeight = lastMaxWeight;
    rationale = `Last session: ${lastMaxWeight}${unit} × ${lastAvgReps}. Hit all reps at this weight before adding load.`;
    status = 'maintain';
  }

  return { suggestedWeight, rationale, status, lastMaxWeight, lastAvgReps, unit, increment };
}

// ═══════════════════════════════════════════════════════
// 1RM CALCULATOR (Epley formula)
// ═══════════════════════════════════════════════════════
function calc1RM(weight, reps){
  if(!weight || !reps || reps < 1) return null;
  if(reps === 1) return parseFloat(weight);
  // Epley: 1RM = w × (1 + r/30)
  return Math.round(parseFloat(weight) * (1 + parseInt(reps)/30) * 2) / 2;
}

// ═══════════════════════════════════════════════════════
// REST TIMER ENGINE
// ═══════════════════════════════════════════════════════
let restTimer = { interval: null, total: 0, remaining: 0, preset: 0 };

function startRest(seconds){
  stopRest(false);
  restTimer.total = seconds;
  restTimer.remaining = seconds;
  restTimer.preset = seconds;
  // Update active preset highlight
  document.querySelectorAll('.rt-preset').forEach(el => {
    const s = el.onclick?.toString().match(/\d+/)?.[0];
    el.classList.toggle('active-preset', parseInt(s) === seconds);
  });
  const timer = document.getElementById('rest-timer');
  if(timer) timer.classList.add('visible');
  updateRestDisplay();
  restTimer.interval = setInterval(() => {
    restTimer.remaining--;
    if(restTimer.remaining <= 0){
      restTimer.remaining = 0;
      updateRestDisplay();
      stopRest(false);
      // Vibrate if available
      if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
      toast('✓ Rest complete — next set!');
    } else {
      updateRestDisplay();
    }
  }, 1000);
}

function stopRest(hide=true){
  if(restTimer.interval){ clearInterval(restTimer.interval); restTimer.interval = null; }
  if(hide){
    const timer = document.getElementById('rest-timer');
    if(timer) timer.classList.remove('visible');
    document.querySelectorAll('.rt-preset').forEach(el => el.classList.remove('active-preset'));
  }
}

function updateRestDisplay(){
  const count = document.getElementById('rt-count');
  const arc = document.getElementById('rt-arc');
  if(!count || !arc) return;
  const s = restTimer.remaining;
  count.textContent = s >= 60 ? `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}` : s;
  const circ = 125.6;
  const pct = restTimer.total > 0 ? restTimer.remaining / restTimer.total : 0;
  arc.style.strokeDashoffset = circ * (1 - pct);
  // Colour shift: green → amber → red as time runs out
  arc.style.stroke = pct > 0.5 ? '#5cb85c' : pct > 0.25 ? '#f4a261' : '#e63946';
  count.style.color = pct > 0.5 ? '#5cb85c' : pct > 0.25 ? '#f4a261' : '#e63946';
}

// ═══════════════════════════════════════════════════════
function calcReadiness(d){
  const factors={};
  // ── SLEEP DURATION (0-25pts) ────────────────────────
  const h=parseFloat(d.sleepHours)||7;
  let sleepDurScore=25;
  if(h>=7&&h<=9)sleepDurScore=25;
  else if(h>=6.5&&h<7)sleepDurScore=20;
  else if(h>9&&h<=10)sleepDurScore=22;
  else if(h>=6&&h<6.5)sleepDurScore=14;
  else if(h>=5&&h<6)sleepDurScore=7;
  else sleepDurScore=0;
  factors.sleepDuration={score:sleepDurScore,max:25,label:'Sleep Duration',value:`${h}h`};

  // ── SLEEP QUALITY (0-20pts) ─────────────────────────
  const sq=parseInt(d.sleepQuality)||5;
  const sleepQScore=Math.round((sq/10)*20);
  factors.sleepQuality={score:sleepQScore,max:20,label:'Sleep Quality',value:`${sq}/10`};

  // ── SORENESS (0-20pts) ──────────────────────────────
  const zones=Object.values(d.soreness||{});
  const avgSoreness=zones.length?zones.reduce((a,b)=>a+b,0)/zones.length:0;
  const maxSoreness=zones.length?Math.max(...zones):0;
  // Penalise high peak soreness more than average
  const sorenessScore=Math.max(0,20-Math.round(avgSoreness*1.5)-Math.round(maxSoreness*0.5));
  factors.soreness={score:sorenessScore,max:20,label:'Muscle Soreness',value:`Avg ${avgSoreness.toFixed(1)}/10`};

  // ── MOOD & MOTIVATION (0-15pts) ─────────────────────
  const mood=parseInt(d.mood)||5;
  const motiv=parseInt(d.motivation)||5;
  const moodScore=Math.round(((mood+motiv)/20)*15);
  factors.mood={score:moodScore,max:15,label:'Mood & Motivation',value:`${mood}/10 · ${motiv}/10`};

  // ── STRESS (0-10pts) ────────────────────────────────
  const stress=parseInt(d.stress)||5;
  const stressScore=Math.round(((10-stress)/10)*10);
  factors.stress={score:stressScore,max:10,label:'Stress Level',value:`${stress}/10`};

  // ── RESTING HR vs BASELINE (0-10pts) ────────────────
  let hrScore=5; // neutral if no data
  const baseline=DB.getHRBaseline();
  if(d.restingHR>0&&baseline){
    const diff=d.restingHR-baseline;
    if(diff<=0)hrScore=10;
    else if(diff<=2)hrScore=9;
    else if(diff<=4)hrScore=7;
    else if(diff<=7)hrScore=4;
    else if(diff<=10)hrScore=2;
    else hrScore=0;
    factors.restingHR={score:hrScore,max:10,label:'Resting HR',value:`${d.restingHR}bpm (base: ${baseline})`};
  } else if(d.restingHR>0){
    hrScore=5;
    factors.restingHR={score:hrScore,max:10,label:'Resting HR',value:`${d.restingHR}bpm (no baseline yet)`};
  } else {
    factors.restingHR={score:hrScore,max:10,label:'Resting HR',value:'Not entered'};
  }

  // ── HRV BONUS (0-5pts) ──────────────────────────────
  let hrvScore=0;
  if(d.hrv>0){
    // Simple: higher HRV is better. We give up to 5 bonus points.
    // Average HRV varies widely; we use relative feel (>50ms good, <20ms poor)
    if(d.hrv>=60)hrvScore=5;
    else if(d.hrv>=45)hrvScore=4;
    else if(d.hrv>=30)hrvScore=3;
    else if(d.hrv>=20)hrvScore=1;
    factors.hrv={score:hrvScore,max:5,label:'HRV',value:`${d.hrv}ms`};
  } else {
    factors.hrv={score:0,max:5,label:'HRV',value:'Not entered (optional)'};
  }

  const total=Object.values(factors).reduce((a,f)=>a+f.score,0);
  const maxTotal=Object.values(factors).reduce((a,f)=>a+f.max,0);
  const pct=Math.round((total/maxTotal)*100);

  return{score:pct,factors,total,maxTotal};
}

function getReadinessStatus(score){
  if(score>=80)return{label:'READY TO TRAIN',color:'#5cb85c',bg:'rgba(92,184,92,0.1)',border:'rgba(92,184,92,0.3)',light:'green',emoji:'🟢'};
  if(score>=60)return{label:'MODIFIED SESSION',color:'#f4a261',bg:'rgba(244,162,97,0.1)',border:'rgba(244,162,97,0.3)',light:'amber',emoji:'🟡'};
  if(score>=40)return{label:'LIGHT ONLY',color:'#e76f51',bg:'rgba(231,111,81,0.1)',border:'rgba(231,111,81,0.3)',light:'orange',emoji:'🟠'};
  return{label:'REST DAY',color:'#e63946',bg:'rgba(230,57,70,0.1)',border:'rgba(230,57,70,0.3)',light:'red',emoji:'🔴'};
}

function getReadinessRecommendations(score,data,sessionType){
  const recs=[];
  const zones=data.soreness||{};
  const h=parseFloat(data.sleepHours)||7;
  const sq=parseInt(data.sleepQuality)||5;
  const stress=parseInt(data.stress)||5;

  // Session-specific soreness warnings
  const upperMuscles=['chest','back','shoulders','arms'];
  const lowerMuscles=['quads','hamstrings','glutes','calves'];
  const relevantMuscles=sessionType==='upper'?upperMuscles:sessionType==='lower'?lowerMuscles:[...upperMuscles,...lowerMuscles];
  const soreMuscles=relevantMuscles.filter(m=>(zones[m]||0)>=6).map(m=>m.charAt(0).toUpperCase()+m.slice(1));
  if(soreMuscles.length){
    recs.push({icon:'⚠️',title:'Soreness Alert',text:`${soreMuscles.join(', ')} soreness is high for today's ${sessionType} session. Consider reducing load on these movements by 15–20% or substituting.`});
  }

  // Sleep
  if(h<6){
    recs.push({icon:'😴',title:'Poor Sleep',text:'Under 6 hours significantly impairs strength output and recovery. Reduce session intensity by 20–25%. Prioritise technique over load today.'});
  } else if(h<7||sq<=4){
    recs.push({icon:'😴',title:'Sleep Below Target',text:'Sleep was below optimal. Warm up thoroughly and gauge how your body feels before pushing hard on primary compounds.'});
  }

  // Score-based
  if(score>=80){
    recs.push({icon:'💪',title:'Full Training',text:'Your recovery markers are strong. Train as programmed. This is a good session to push for progressive overload on primary compounds.'});
  } else if(score>=60){
    recs.push({icon:'↘️',title:'Load Reduction',text:'Reduce primary compound loads by 10–15%. Keep volume (sets/reps) the same. Focus on quality of movement over maximum weight.'});
    recs.push({icon:'⏸️',title:'Skip High-Intensity',text:'Avoid max-effort sets or PR attempts today. Save those for when your readiness score is above 80.'});
  } else if(score>=40){
    recs.push({icon:'🔄',title:'Active Recovery Mode',text:'Today is not a day to challenge your body. Perform mobility work, light movement at 40–50% usual load, or swap to a full rest day.'});
    recs.push({icon:'📉',title:'Reduce Volume',text:'Cut sets by 40–50%. Do 2 sets instead of 4–5. Focus on movement quality. End the session if you feel worse during warm-up.'});
  } else {
    recs.push({icon:'🛌',title:'Take a Full Rest Day',text:'Your body is in significant recovery debt. Training today risks injury and will delay your overall progress. Sleep, eat well, hydrate.'});
    recs.push({icon:'🧘',title:'Active Rest Options',text:'Light walking, gentle stretching, or a 10-minute mobility flow are the most beneficial activities today.'});
  }

  // Stress
  if(stress>=7){
    recs.push({icon:'🧠',title:'High Stress',text:'Psychological stress elevates cortisol, which competes with recovery. Keep the session short and enjoyable — not grinding. This is not the day to test yourself.'});
  }

  // HR spike
  const baseline=DB.getHRBaseline();
  if(data.restingHR>0&&baseline&&(data.restingHR-baseline)>7){
    recs.push({icon:'❤️',title:'Elevated Resting HR',text:`Your resting HR is ${data.restingHR-baseline}bpm above your baseline of ${baseline}bpm. This commonly signals incomplete recovery, mild illness, or dehydration. Drink water and reassess during warm-up.`});
  }

  return recs;
}

function getLibraryExercise(name){
  return EXERCISE_LIBRARY.find(e=>e.name===name)
    ||EXERCISE_LIBRARY.find(e=>name.includes(e.name)||e.name.includes(name.split(' (')[0].split(' /')[0].trim()));
}

function renderLibrary(){
  if(S.library.exercise){
    return renderExerciseDetail(S.library.exercise);
  }
  const q=(S.library.search||'').toLowerCase();
  const cat=S.library.filter||'ALL';
  const filtered=EXERCISE_LIBRARY.filter(e=>{
    const matchCat=cat==='ALL'||e.category===cat;
    const matchQ=!q||e.name.toLowerCase().includes(q)||e.primary.join(' ').toLowerCase().includes(q)||e.category.toLowerCase().includes(q);
    return matchCat&&matchQ;

    <div class="hdr-title">LIBRARY</div>

  </div>

    ${LIB_CATEGORIES.map(c=>`<div class="filter-chip${cat===c?' active':''}" onclick="S.library.filter='${c}';render()">${c}</div>`).join('')}

  <div style="padding:8px 16px 4px;font-size:9px;color:var(--text4);letter-spacing:.1em">${filtered.length} EXERCISES</div>

    <div style="padding:6px 16px 2px;font-family:var(--font-display);font-size:11px;font-weight:900;color:var(--text4);letter-spacing:.14em;border-bottom:1px solid var(--border2)">${letter}</div>

  </div>
  <div style="height:16px"></div>
  </div>`;
}

function renderLibraryList(){
  const q=(S.library.search||'').toLowerCase();
  const cat=S.library.filter||'ALL';
  const filtered=EXERCISE_LIBRARY.filter(e=>{
    const matchCat=cat==='ALL'||e.category===cat;
    const matchQ=!q||e.name.toLowerCase().includes(q)||e.primary.join(' ').toLowerCase().includes(q);
    return matchCat&&matchQ;
  });
  const groups={};
  filtered.forEach(e=>{const l=e.name[0];if(!groups[l])groups[l]=[];groups[l].push(e);});
  const el=document.getElementById('lib-list');
  if(!el)return;
  el.innerHTML=Object.keys(groups).sort().map(letter=>`
    <div style="padding:6px 16px 2px;font-family:var(--font-display);font-size:11px;font-weight:900;color:var(--text4);letter-spacing:.14em;border-bottom:1px solid var(--border2)">${letter}</div>
    ${groups[letter].map(ex=>`<div class="ex-lib-item" onclick="S.library.exercise='${ex.name.replace(/'/g,"\\'")}';render()">

    </div>`).join('')}
  `).join('')+(filtered.length===0?`<div class="empty"><span class="empty-icon">🔍</span>No results</div>`:'');
}

// Muscle heat status based on days since last trained
function getMuscleHeatStatus(daysSince){
  if(daysSince === null) return {label:'No data', color:'#444', cls:'heat-fresh', pct:0, emoji:'⚫'};
  if(daysSince <= 1)     return {label:'Today/Yesterday', color:'#e63946', cls:'heat-today', pct:95, emoji:'🔴'};
  if(daysSince <= 2)     return {label:'2 days ago', color:'#e76f51', cls:'heat-2day', pct:75, emoji:'🟠'};
  if(daysSince <= 3)     return {label:'3 days ago', color:'#f4a261', cls:'heat-3day', pct:50, emoji:'🟡'};
  if(daysSince <= 5)     return {label:'Ready', color:'#5cb85c', cls:'heat-ready', pct:25, emoji:'🟢'};
  return {label:'Fully fresh', color:'#5cb85c', cls:'heat-ready', pct:10, emoji:'🟢'};
}

// Core engine: returns daysSince map for all muscle groups
function getMuscleFrequencyData(){
  const workouts = DB.getWorkoutList()
    .filter(w => w.completed && w.exercises)
    .slice(0, 30); // last 30 sessions max

  const lastTrained = {}; // groupId → Date
  const now = new Date();
  now.setHours(0,0,0,0);

  workouts.forEach(w => {
    const wDate = new Date(w.date + 'T00:00:00');
    const daysDiff = Math.round((now - wDate) / 86400000);

    w.exercises.forEach(ex => {
      const libEx = getLibraryExercise(ex.name);
      if(!libEx) return;
      const allMuscles = [...(libEx.primary||[]), ...(libEx.secondary||[])];
      allMuscles.forEach(m => {
        const group = MUSCLE_MAP[m];
        if(!group) return;
        if(lastTrained[group] === undefined || daysDiff < lastTrained[group]){
          lastTrained[group] = daysDiff;
        }
      });
    });
  });

  return MUSCLE_GROUPS.map(g => ({
    ...g,
    daysSince: lastTrained[g.id] !== undefined ? lastTrained[g.id] : null,
    status: getMuscleHeatStatus(lastTrained[g.id] !== undefined ? lastTrained[g.id] : null)
  }));
}

// Session muscle impact — which groups does today's session hit?
function getSessionMuscleGroups(blockIdx, weekIdx, sessionType){
  const block = BLOCKS[blockIdx];
  if(!block) return [];
  const session = block.sessions[sessionType];
  if(!session) return [];
  const groups = new Set();
  session.exercises.forEach(ex => {
    const libEx = getLibraryExercise(ex.name);
    if(!libEx) return;
    [...(libEx.primary||[])].forEach(m => {
      const g = MUSCLE_MAP[m]; if(g) groups.add(g);
    });
  });
  return [...groups];
}

// ── HOME STRIP ───────────────────────────────────────────
function renderHomeMuscleStrip(){
  const data = getMuscleFrequencyData();
  const hasData = data.some(g => g.daysSince !== null);
  if(!hasData) return '';

  const rec = getCurrentRecommendation();
  const sessionGroups = new Set(getSessionMuscleGroups(rec.block, rec.week, rec.session));

  return`<div class="muscle-strip" onclick="nav('muscles')">

      <span style="color:var(--accent);font-size:9px">VIEW FULL MAP ›</span>

}

// ── FULL TRACKER SCREEN ──────────────────────────────────
function renderMuscleTracker(){
  const data = getMuscleFrequencyData();
  const rec = getCurrentRecommendation();
  const sessionGroups = new Set(getSessionMuscleGroups(rec.block, rec.week, rec.session));
  const block = BLOCKS[rec.block];
  const session = block.sessions[rec.session];
  const hasAnyData = data.some(g => g.daysSince !== null);

  // Workout recommendations based on recovery state
  const warningGroups = data.filter(g => sessionGroups.has(g.id) && g.daysSince !== null && g.daysSince <= 1);
  const borderlineGroups = data.filter(g => sessionGroups.has(g.id) && g.daysSince !== null && g.daysSince === 2);
  const readyGroups = data.filter(g => sessionGroups.has(g.id) && (g.daysSince === null || g.daysSince >= 3));

  let recStatus = 'GO';
  let recColor = '#5cb85c';
  let recMsg = '';
  if(warningGroups.length >= 2){
    recStatus = 'CAUTION';
    recColor = '#e63946';
    recMsg = `${warningGroups.map(g=>g.label).join(', ')} trained within 24h — reduce load 15–20% or swap session.`;
  } else if(warningGroups.length === 1 || borderlineGroups.length >= 2){
    recStatus = 'MODIFIED';
    recColor = '#f4a261';
    recMsg = `${[...warningGroups,...borderlineGroups].map(g=>g.label).join(', ')} may be under-recovered. Monitor during warm-up.`;
  } else {
    recMsg = 'Target muscles are well recovered. Train as programmed.';
  }

  const frontGroups = data.filter(g => g.side === 'front');
  const backGroups = data.filter(g => g.side === 'back');

  return`<div class="fade-slide">
  <div class="hdr">
    <div class="hdr-sub">Recovery Status</div>
    <div class="hdr-title">MUSCLE MAP</div>
  </div>

  <!-- Body SVG heatmap -->
  <div style="background:var(--surf);border-bottom:1px solid var(--border);padding-bottom:16px">
    <div class="body-wrap">
      <div class="body-panel">
        <div class="body-label">FRONT</div>
        ${renderBodySVG('front', data)}
      </div>
      <div class="body-panel">
        <div class="body-label">BACK</div>
        ${renderBodySVG('back', data)}
      </div>
    </div>
    <!-- Legend -->
    <div style="display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:0 16px">
      ${[['#e63946','Recovering (0–1d)'],['#f4a261','Approaching (2–3d)'],['#5cb85c','Ready (4d+)'],['#444','No data']].map(([c,l])=>
        `<div style="display:flex;align-items:center;gap:5px">
          <div style="width:10px;height:10px;border-radius:50%;background:${c}"></div>
          <span style="font-size:9px;color:var(--text4)">${l}</span>
        </div>`
      ).join('')}
    </div>
  </div>

  <!-- Session readiness panel -->
  <div style="margin:12px 16px;background:var(--surf);border:1px solid var(--border);border-left:3px solid ${recColor};border-radius:5px;padding:14px">
    <div style="font-size:9px;color:var(--text4);letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px">NEXT SESSION — ${session?.label||''}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <div style="font-family:var(--font-display);font-size:20px;font-weight:900;color:${recColor}">${recStatus}</div>
      <div style="font-size:10px;color:var(--text2);line-height:1.6;flex:1">${recMsg}</div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      ${data.filter(g => sessionGroups.has(g.id)).map(g =>
        `<div style="display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:3px;background:${g.status.cls==='heat-today'?'rgba(230,57,70,.1)':g.status.cls==='heat-2day'?'rgba(231,111,81,.1)':g.status.cls==='heat-3day'?'rgba(244,162,97,.1)':'rgba(92,184,92,.1)'};border:1px solid ${g.status.color}30">
          <span style="font-size:10px">${g.status.emoji}</span>
          <span style="font-family:var(--font-display);font-size:12px;font-weight:700;color:${g.status.color}">${g.label}</span>
          <span style="font-size:9px;color:var(--text4)">${g.daysSince===null?'fresh':g.daysSince===0?'today':g.daysSince+'d'}</span>
        </div>`
      ).join('')}
    </div>
  </div>

  <!-- Full muscle list -->
  <div class="section-label">ALL MUSCLE GROUPS</div>
  <div style="margin:0 16px;border:1px solid var(--border);border-radius:6px;overflow:hidden">
    ${data.map((g, i) => {
      const isTarget = sessionGroups.has(g.id);
      const dLabel = g.daysSince === null ? 'No data' : g.daysSince === 0 ? 'Today' : g.daysSince === 1 ? 'Yesterday' : `${g.daysSince} days ago`;
      return`<div class="muscle-list-row" style="${i===data.length-1?'border-bottom:none':''}">
        <div style="width:28px;text-align:center;font-size:16px">${g.icon}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
            <span style="font-family:var(--font-display);font-size:14px;font-weight:700;color:${isTarget?g.status.color:'var(--text)'}">${g.label}</span>
            ${isTarget?`<span style="font-size:8px;color:var(--accent);letter-spacing:.1em">TODAY</span>`:''}
          </div>
          <div class="muscle-heat-bar-wrap">
            <div class="muscle-heat-bar" style="width:${g.daysSince===null?0:Math.max(5,100-g.daysSince*18)}%;background:${g.status.color}"></div>
          </div>
        </div>
        <div style="text-align:right;padding-left:10px;flex-shrink:0">
          <div class="muscle-days-badge" style="color:${g.status.color}">${g.daysSince===null?'–':g.daysSince===0?'0d':g.daysSince+'d'}</div>
          <div class="muscle-status-text" style="color:${g.status.color}">${g.daysSince===null?'NO DATA':g.daysSince<=1?'RECOVERING':g.daysSince<=3?'BUILDING':'READY'}</div>
        </div>
      </div>`;
    }).join('')}
  </div>

  ${!hasAnyData?`<div style="margin:12px 16px;padding:14px;background:var(--surf);border:1px solid var(--border);border-radius:5px;font-size:10px;color:var(--text3);line-height:1.7">
    Complete some workouts to start seeing your muscle recovery data here. The tracker reads your logged sessions and maps each exercise to its primary muscle groups automatically.
  </div>`:''}

  <div style="height:16px"></div>
  </div>`;
}

// ── SVG BODY RENDERER ────────────────────────────────────
function renderBodySVG(side, data){
  const regions = BODY_SVG_REGIONS[side];
  const groupMap = {};
  data.forEach(g => { groupMap[g.id] = g; });

  // Body outline paths
  const bodyOutline = side === 'front'
    ? `M40,5 C28,5 20,12 18,22 L14,38 C10,40 7,45 8,52 L10,65 C8,68 6,74 6,82 L6,95 C4,98 4,102 6,105 L8,112 L16,112 L16,160 C16,165 18,168 18,178 C18,185 16,190 16,200 C16,205 18,208 22,210 L28,210 L28,200 L30,200 L30,210 L36,210 L36,195 L38,170 L40,170 L42,195 L42,210 L48,210 L48,200 L50,200 L50,210 L56,210 C60,208 62,205 62,200 C62,190 60,185 60,178 C60,168 62,165 62,160 L64,112 L72,112 L74,105 C76,102 76,98 74,95 L74,82 C74,74 72,68 70,65 L72,52 C73,45 70,40 66,38 L62,22 C60,12 52,5 40,5 Z`
    : `M40,5 C28,5 20,12 18,22 L14,38 C10,40 7,45 8,52 L10,65 C8,68 6,74 6,82 L6,95 C4,98 4,102 6,105 L8,112 L16,112 L16,138 L14,178 C14,182 16,185 16,195 L16,210 C16,210 20,212 24,210 L24,195 C24,190 26,185 28,180 L36,178 L40,180 L44,178 L52,180 C54,185 56,190 56,195 L56,210 C60,212 64,210 64,210 L64,195 C64,185 66,182 66,178 L64,138 L64,112 L72,112 L74,105 C76,102 76,98 74,95 L74,82 C74,74 72,68 70,65 L72,52 C73,45 70,40 66,38 L62,22 C60,12 52,5 40,5 Z`;

  const fills = Object.entries(regions).map(([groupId, path]) => {
    const g = groupMap[groupId];
    if(!g) return `<path d="${path}" fill="var(--surf3)" opacity="0.5"/>`;
    const color = g.status.color;
    const opacity = g.daysSince === null ? 0.15 : g.daysSince <= 1 ? 0.7 : g.daysSince <= 3 ? 0.5 : 0.35;
    return `<path d="${path}" fill="${color}" opacity="${opacity}"/>`;
  }).join('');

  return`<svg viewBox="0 0 80 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:120px;display:block;margin:0 auto">
    <!-- Body outline -->
    <path d="${bodyOutline}" fill="var(--surf3)" stroke="var(--border)" stroke-width="1"/>
    <!-- Muscle regions -->
    ${fills}
    <!-- Subtle region outlines -->
    ${Object.values(regions).map(path => `<path d="${path}" fill="none" stroke="var(--border)" stroke-width="0.5" opacity="0.4"/>`).join('')}
  </svg>`;
}
